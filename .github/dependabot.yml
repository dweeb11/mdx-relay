version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
      lint-toolchain:
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          # typescript is grouped here because typescript-eslint constrains it
          # via peer range (">=4.8.4 <6.1.0" as of 8.65.0). Bumped separately,
          # a TypeScript major opens a PR that cannot resolve. See PR #59.
          - typescript
    ignore:
      # Keep compatible 6.0.x updates flowing, but do not propose versions outside
      # typescript-eslint's declared peer range. Remove or raise this ceiling
      # when the active typescript-eslint release accepts newer TypeScript.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
