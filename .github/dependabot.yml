version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    ignore:
      # Runtime is intentionally pinned to Node 22. Keep its ambient types on
      # the same major; tests/unit/toolchain/node-types-version.test.ts enforces
      # the package and lockfile side of this contract.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
      lint-toolchain:
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          # typescript is grouped here because typescript-eslint constrains it
          # via peer range (">=4.8.4 <6.1.0" as of 8.66.0). Bumped separately,
          # a TypeScript major opens a PR that cannot resolve. See PR #59.
          - typescript
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          # init and analyze must move together: the codeql-workflow unit
          # test requires every codeql-action use to share one pinned SHA,
          # so separate PRs can never pass verify. See PRs #70/#71.
          - "github/codeql-action*"
    labels:
      - dependencies
